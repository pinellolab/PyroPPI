[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroppi"
version = "1.0.0"
description = "Bayesian hierarchical model for PPI Recorder base-editor two-hybrid screens"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "jax",
    "numpyro",
    "optax",
    "tqdm",
]

[project.optional-dependencies]
figures = ["matplotlib", "scikit-learn"]
reads = ["pysam"]
notebooks = ["jupyter", "pyroppi[figures]", "pyroppi[reads]"]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9/F) plus: line length; import order (I); the pyupgrade
# set (UP), which keeps the annotations on one spelling; bugbear (B) and the
# comprehension, logging and misc-lint sets that catch real defects rather than
# formatting taste. Formatting itself is deliberately not enforced: these files
# are read far more often than they are edited.
select = [
    "E4", "E501", "E7", "E9", "F", "W",
    "I", "UP", "B", "C4", "SIM", "LOG", "G", "PIE", "EXE", "RUF",
]
ignore = [
    # zip(..., strict=) would turn an invariant the call sites already enforce
    # (equal-length sequences, checked just above) into a crash.
    "B905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
